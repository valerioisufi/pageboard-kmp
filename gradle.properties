#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#Kotlin Multiplatform
# iosMain uses the cinterop bindings (Google Ink, MicroTeX): commonize them for the shared source set
kotlin.mpp.enableCInteropCommonization=true
#Publishing (build-logic: PublishConventionPlugin)
GROUP=io.github.valerioisufi
VERSION_NAME=0.1.0-SNAPSHOT
# The repository on GitHub, for the POM and the links of the documentation to the sources
POM_URL=https://github.com/valerioisufi/pageboard-kmp
POM_SCM=github.com/valerioisufi/pageboard-kmp
