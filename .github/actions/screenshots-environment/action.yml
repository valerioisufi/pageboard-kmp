# The reference environment of the screenshot tests (docs/plans/ci-screenshots.md): the image of
# tools/screenshots/Dockerfile, built with the cache of Actions, and the Gradle home that the
# container uses, kept between runs. The steps that follow run tools/screenshots/run.sh with
# SCREENSHOTS_NO_BUILD and SCREENSHOTS_GRADLE_HOME, which this action sets.
name: Screenshots environment
description: The image and the Gradle home in which the reference screenshots are recorded and verified

runs:
  using: composite
  steps:
    - name: The toolchain of the iroh bridge
      id: rust
      shell: bash
      run: echo "toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' native/iroh-bridge/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - name: The image
      uses: docker/build-push-action@v6
      with:
        context: tools/screenshots
        platforms: linux/amd64
        build-args: RUST_TOOLCHAIN=${{ steps.rust.outputs.toolchain }}
        tags: drawview-screenshots
        load: true
        cache-from: type=gha,scope=screenshots
        cache-to: type=gha,scope=screenshots,mode=max
    # The dependencies and the build cache (the JNI libraries of the same sources among them)
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gradle-screenshots
        key: screenshots-gradle-${{ hashFiles('gradle/**', 'build-logic/**', 'native/**', 'tools/screenshots/Dockerfile') }}
        restore-keys: screenshots-gradle-
    - name: The variables of run.sh
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gradle-screenshots"
        echo "SCREENSHOTS_GRADLE_HOME=$RUNNER_TEMP/gradle-screenshots" >> "$GITHUB_ENV"
        echo "SCREENSHOTS_NO_BUILD=1" >> "$GITHUB_ENV"
