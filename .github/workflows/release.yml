# A release of the libraries on Maven Central, from a tag drawview-vX.Y.Z (VERSION_NAME without
# -SNAPSHOT; the applications have tags pencilnotes-v* of their own, which never release the libraries):
# the JNI libraries of every desktop platform built on its own runner, then published together
# (-Pdrawview.native.prebuilt=true: a release without one of them fails), signed.
#
# Secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD (a token of the Central Portal),
# SIGNING_KEY (an armored PGP key), SIGNING_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['drawview-v*']

jobs:
  natives:
    strategy:
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-14
          - platform: darwin-x86_64
            runner: macos-14
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: JNI libraries of ${{ matrix.platform }}
        run: ./gradlew buildDesktopNativeLibs -Pdrawview.desktop.platform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: build/nativeLibs/jvm

  publish:
    needs: natives
    runs-on: macos-14
    permissions:
      # The release of GitHub with the PDFium of the iOS applications
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag is the version
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "drawview-v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: build/nativeLibs/jvm
          merge-multiple: true
      - name: Publish on Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Pdrawview.native.prebuilt=true -Pdrawview.pdfium.desktop=all
      - name: PDFium for the iOS applications
        run: |
          ./gradlew assemblePdfiumXcframework
          (cd build/pdfium && zip -qry PDFium.xcframework.zip PDFium.xcframework)
      - name: Documentation
        run: ./gradlew :dokkaGenerate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html
      - uses: softprops/action-gh-release@v2
        with:
          files: build/pdfium/PDFium.xcframework.zip

  # The documentation of the version released, on GitHub Pages (the source of the Pages of the
  # repository set to GitHub Actions)
  documentation:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
