# A release of the libraries on Maven Central, from a tag pageboard-vX.Y.Z (VERSION_NAME without
# -SNAPSHOT; the applications have tags pencilnotes-v* of their own, which never release the libraries):
# the JNI libraries of every desktop platform built on its own runner, then published together
# (-Ppageboard.native.prebuilt=true: a release without one of them fails), signed.
#
# Secrets, of the environment maven-central: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD (a token of the Central Portal),
# SIGNING_KEY (an armored PGP key), SIGNING_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ['pageboard-v*']

jobs:
  natives:
    strategy:
      matrix:
        # macos-26, not older: the clang of Xcode 15.4 (macos-14) finds brush_paint.cc of Ink ambiguous
        include:
          - platform: darwin-aarch64
            runner: macos-26
          - platform: darwin-x86_64
            runner: macos-26
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: JNI libraries of ${{ matrix.platform }}
        run: ./gradlew buildDesktopNativeLibs -Ppageboard.desktop.platform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: build/nativeLibs/jvm

  publish:
    needs: natives
    runs-on: macos-26
    # The secrets of Maven Central are kept in this environment, which only the tags pageboard-v*
    # may use
    environment: maven-central
    permissions:
      # The release of GitHub with the PDFium of the iOS applications
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: The tag is the version
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "pageboard-v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match VERSION_NAME=${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: build/nativeLibs/jvm
          merge-multiple: true
      - name: Publish on Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral -Ppageboard.native.prebuilt=true -Ppageboard.pdfium.desktop=all
      - name: PDFium for the iOS applications
        run: |
          ./gradlew assemblePdfiumXcframework
          (cd build/pdfium && zip -qry PDFium.xcframework.zip PDFium.xcframework)
      - name: Documentation
        run: ./gradlew :dokkaGenerate
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/dokka/html
      - uses: softprops/action-gh-release@v3
        with:
          files: build/pdfium/PDFium.xcframework.zip

  # The documentation of the version released, on GitHub Pages (the source of the Pages of the
  # repository set to GitHub Actions)
  documentation:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
