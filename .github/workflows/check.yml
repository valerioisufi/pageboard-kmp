# The checks of every change: the tests of the JVM, the public API of the libraries (api/), the
# compilation of every platform and the libraries as another developer uses them.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Not an older one: the clang of Xcode 15.4 (macos-14) finds brush_paint.cc of Ink ambiguous
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/native-caches
        with:
          key: check
      # --continue: every failure in one run, not the first one only
      - name: Tests and public API
        run: ./gradlew --continue jvmTest checkKotlinAbi
      - name: Every platform
        run: ./gradlew --continue compileAndroidMain compileKotlinIosSimulatorArm64
      - name: The libraries as another developer uses them
        run: ./consumer-checks/check.sh
      # The logs show the name of an exception only: its message is in these
      - name: Keep the results of the tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-check
          path: '*/build/test-results/jvmTest/*.xml'
          if-no-files-found: ignore

  # The APKs of every change, on Linux, for the ABI of the real devices. All the ABIs are checked by
  # native.yml
  android:
    name: Android applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/native-caches
        with:
          key: check-android
      - name: Free the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: The applications
        run: ./gradlew :pencilnotes-android:assembleDebug :sample-android:assembleDebug -Ppageboard.android.debug.abis=arm64-v8a
