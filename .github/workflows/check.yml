# The checks of every change: the tests of the JVM, the public API of the libraries (api/), the
# compilation of every platform and the libraries as another developer uses them.
name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and public API
        run: ./gradlew jvmTest checkKotlinAbi
      - name: Every platform
        run: ./gradlew compileAndroidMain compileKotlinIosSimulatorArm64 :pencilnotes-android:assembleDebug :sample-android:assembleDebug
      - name: The libraries as another developer uses them
        run: ./consumer-checks/check.sh
