name: Native libraries

# Builds and tests the native engines (Google Ink, MicroTeX, PDFium, the iroh bridge) on every
# platform (the Rust toolchain of native/iroh-bridge/rust-toolchain.toml is installed by rustup):
# - desktop: the JNI libraries of each platform, built on a matching runner and merged into
#   the jvm jars of :pageboard-ink, :pageboard-canvas, :pageboard-latex and :pageboard-pdf (artifact "desktop-jars");
# - android: the NDK libraries (+ the prebuilt libpdfium.so) of the debug APK;
# - ios: the static libraries + PDFium.xcframework, tested on the simulator and linked by the app.

# Only the changes that can touch the native engines start it (docs/plans/ci-time.md): the other ones
# are checked by check.yml. The weekly run ignores the filter, and finds a change of the runners too.
on:
  push:
    branches: [main]
    paths: &native-paths
      - native/**
      - pageboard-native-*/**
      - pageboard-ink/**
      - pageboard-canvas/**
      - pageboard-latex/**
      - pageboard-pdf/**
      - pageboard-lecture/**
      - pageboard-lecture-testing/**
      - pageboard-sync-iroh/**
      - build-logic/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - sample/**
      - pencilnotes/androidApp/**
      - .github/workflows/native.yml
      - .github/actions/**
  pull_request:
    paths: *native-paths
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-aarch64, runner: macos-latest }
          # Cross-compiled on Apple silicon, tested there under Rosetta 2 with an x86_64 JDK
          - { platform: darwin-x86_64, runner: macos-latest }
          - { platform: windows-x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: ./.github/actions/native-caches
        with:
          key: native-desktop-${{ matrix.platform }}

      # The libraries of the same sources are not built again. Not for release.yml
      - name: Restore the JNI libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: build/nativeLibs/jvm
          key: native-libraries-${{ matrix.platform }}-${{ hashFiles('native/**', 'gradle/libs.versions.toml', 'build.gradle.kts') }}

      - name: Build the JNI libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        run: ./gradlew buildDesktopNativeLibs -Ppageboard.desktop.platform=${{ matrix.platform }}

      - name: Save the JNI libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/nativeLibs/jvm
          key: ${{ steps.libraries.outputs.cache-primary-key }}

      # The JVM of Intel Macs, under Rosetta 2: its tests load the x86_64 libraries
      - name: Rosetta 2
        if: matrix.platform == 'darwin-x86_64'
        run: arch -x86_64 /usr/bin/true || { echo "::error::No Rosetta 2 on this runner: test darwin-x86_64 on an Intel one"; exit 1; }
      - name: The JDK of Intel Macs
        if: matrix.platform == 'darwin-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
          architecture: x64

      - name: Test the native engines
        run: >
          ./gradlew :pageboard-ink:jvmTest :pageboard-canvas:jvmTest :pageboard-latex:jvmTest :pageboard-pdf:jvmTest :pageboard-lecture:jvmTest :pageboard-sync-iroh:jvmTest
          -Ppageboard.native.prebuilt=true

      # The logs show the name of an exception only: its message is in these
      - name: Keep the results of the tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: '*/build/test-results/jvmTest/*.xml'

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/nativeLibs/jvm
          if-no-files-found: error

  # The JNI libraries of Linux, built on the oldest system they promise (manylinux_2_28: glibc 2.28)
  # and checked for it, then tested on the runner (linux-tests)
  linux:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04, image: manylinux_2_28_x86_64 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, image: manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: CMake and the toolchain of the iroh bridge
        run: |
          dnf install -y cmake
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore the JNI libraries
        id: libraries
        uses: actions/cache/restore@v4
        with:
          path: build/nativeLibs/jvm
          key: native-libraries-manylinux-${{ matrix.platform }}-${{ hashFiles('native/**', 'gradle/libs.versions.toml', 'build.gradle.kts') }}

      - name: Build the JNI libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        run: ./gradlew buildDesktopNativeLibs -Ppageboard.desktop.platform=${{ matrix.platform }}

      - name: Check them against glibc 2.28
        run: native/scripts/check_linux_libraries.sh build/nativeLibs/jvm

      - name: Save the JNI libraries
        if: steps.libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/nativeLibs/jvm
          key: ${{ steps.libraries.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/nativeLibs/jvm
          if-no-files-found: error

  linux-tests:
    name: Desktop ${{ matrix.platform }} tests
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # Skiko loads them, and the ARM image of the runners does not have them
      - name: Install the libraries of Skiko
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/nativeLibs/jvm

      - name: Test the native engines
        run: >
          ./gradlew :pageboard-ink:jvmTest :pageboard-canvas:jvmTest :pageboard-latex:jvmTest :pageboard-pdf:jvmTest :pageboard-lecture:jvmTest :pageboard-sync-iroh:jvmTest
          -Ppageboard.native.prebuilt=true

      - name: Keep the results of the tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: '*/build/test-results/jvmTest/*.xml'

  desktop-jars:
    name: Desktop jars (all platforms)
    needs: [desktop, linux]
    # macOS: the install name of the macOS libpdfium is fixed (and re-signed) during extraction
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/nativeLibs/jvm
          merge-multiple: true

      - name: Assemble the jvm jars
        # prebuilt: use the libraries of the matrix; all: libpdfium of every desktop platform
        run: >
          ./gradlew -Ppageboard.native.prebuilt=true -Ppageboard.pdfium.desktop=all
          :pageboard-ink:jvmJar :pageboard-canvas:jvmJar :pageboard-latex:jvmJar :pageboard-pdf:jvmJar :pageboard-lecture:jvmJar
          :pageboard-sync-iroh:jvmJar

      - name: Check that every platform is bundled
        run: |
          missing=0
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64 windows-x86_64; do
            case "$platform" in
              darwin-*) pre=lib; ext=dylib ;;
              linux-*) pre=lib; ext=so ;;
              windows-*) pre=; ext=dll ;;
            esac
            entries=(
              "pageboard-ink:${pre}ink_bridge"
              "pageboard-latex:${pre}tex"
              "pageboard-pdf:${pre}pdfium_bridge"
              "pageboard-pdf:${pre}pdfium"
              "pageboard-lecture:${pre}whisper_bridge"
              "pageboard-sync-iroh:${pre}iroh_bridge"
            )
            if [[ "$platform" == darwin-* ]]; then
              entries+=("pageboard-canvas:${pre}trackpad_bridge" "pageboard-lecture:${pre}audio_codec_bridge")
            fi
            for entry in "${entries[@]}"; do
              module="${entry%%:*}"; file="native/$platform/${entry#*:}.$ext"
              if ! unzip -l "$module/build/libs/$module-jvm.jar" | grep -q " $file$"; then
                echo "::error::$file missing from the $module jar"
                missing=1
              fi
            done
          done
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-jars
          path: pageboard-*/build/libs/*-jvm.jar
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: ./.github/actions/native-caches
        with:
          key: native-android

      # The native libraries of three ABIs fill the disk of the runner. The Android SDK stays
      - name: Free the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Build the debug APK
        run: ./gradlew :sample-android:assembleDebug :pencilnotes-android:assembleDebug :pageboard-native-iroh:assembleRelease

      - name: Check the iroh bridge of every ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l pageboard-native-iroh/build/outputs/aar/*-release.aar | grep -q " jni/$abi/libiroh_bridge.so$" \
              || { echo "::error::jni/$abi/libiroh_bridge.so missing from pageboard-native-iroh"; exit 1; }
          done

      - name: Check the native libraries of the APK
        run: |
          apk=$(ls sample/androidApp/build/outputs/apk/debug/*.apk | head -1)
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in ink_bridge tex pdfium_bridge pdfium; do
              if ! unzip -l "$apk" | grep -q " lib/$abi/lib$lib.so$"; then
                echo "::error::lib/$abi/lib$lib.so missing from the APK"
                missing=1
              fi
            done
          done
          exit $missing

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - uses: ./.github/actions/native-caches
        with:
          key: native-ios

      - name: Test PDFium and the iroh bridge on the simulator
        run: ./gradlew :pageboard-pdf:iosSimulatorArm64Test :pageboard-sync-iroh:iosSimulatorArm64Test

      - name: Build the app for the simulator
        # -target: the iosApp scheme is not shared (xcuserdata)
        run: >
          xcodebuild -project sample/iosApp/iosApp.xcodeproj -target iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build/xcode" CODE_SIGNING_ALLOWED=NO build

      - name: Check that PDFium.framework is embedded
        run: test -f build/xcode/Debug-iphonesimulator/*.app/Frameworks/PDFium.framework/PDFium
