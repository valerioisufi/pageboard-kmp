name: Native libraries

# Builds and tests the native engines (Google Ink, MicroTeX, PDFium) on every platform:
# - desktop: the JNI libraries of each platform, built on a matching runner and merged into
#   the jvm jars of :drawview-core, :drawview-latex and :drawview-pdf (artifact "desktop-jars");
# - android: the NDK libraries (+ the prebuilt libpdfium.so) of the debug APK;
# - ios: the static libraries + PDFium.xcframework, tested on the simulator and linked by the app.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-aarch64, runner: macos-latest, test: true }
          # Cross-compiled on Apple silicon: the JVM tests would run the arm64 libraries
          - { platform: darwin-x86_64, runner: macos-latest, test: false }
          - { platform: linux-x86_64, runner: ubuntu-latest, test: true }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm, test: true }
          - { platform: windows-x86_64, runner: windows-latest, test: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Install CMake
        if: runner.os == 'Linux'
        run: command -v cmake || (sudo apt-get update && sudo apt-get install -y cmake)

      - name: Build the JNI libraries
        run: ./gradlew buildDesktopNativeLibs -Pdrawview.desktop.platform=${{ matrix.platform }}

      - name: Test the native engines
        if: matrix.test
        run: ./gradlew :drawview-core:jvmTest :drawview-latex:jvmTest :drawview-pdf:jvmTest

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/nativeLibs/jvm
          if-no-files-found: error

  desktop-jars:
    name: Desktop jars (all platforms)
    needs: desktop
    # macOS: the install name of the macOS libpdfium is fixed (and re-signed) during extraction
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/nativeLibs/jvm
          merge-multiple: true

      - name: Assemble the jvm jars
        # prebuilt: use the libraries of the matrix; all: libpdfium of every desktop platform
        run: >
          ./gradlew -Pdrawview.native.prebuilt=true -Pdrawview.pdfium.desktop=all
          :drawview-core:jvmJar :drawview-latex:jvmJar :drawview-pdf:jvmJar

      - name: Check that every platform is bundled
        run: |
          missing=0
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64 windows-x86_64; do
            case "$platform" in
              darwin-*) pre=lib; ext=dylib ;;
              linux-*) pre=lib; ext=so ;;
              windows-*) pre=; ext=dll ;;
            esac
            for entry in \
              "drawview-core:${pre}ink_bridge" \
              "drawview-latex:${pre}tex" \
              "drawview-pdf:${pre}pdfium_bridge" \
              "drawview-pdf:${pre}pdfium"; do
              module="${entry%%:*}"; file="native/$platform/${entry#*:}.$ext"
              if ! unzip -l "$module/build/libs/$module-jvm.jar" | grep -q " $file$"; then
                echo "::error::$file missing from the $module jar"
                missing=1
              fi
            done
          done
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-jars
          path: drawview-*/build/libs/*-jvm.jar
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Build the debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Check the native libraries of the APK
        run: |
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          missing=0
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in ink_bridge tex pdfium_bridge pdfium; do
              if ! unzip -l "$apk" | grep -q " lib/$abi/lib$lib.so$"; then
                echo "::error::lib/$abi/lib$lib.so missing from the APK"
                missing=1
              fi
            done
          done
          exit $missing

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Test PDFium on the simulator
        run: ./gradlew :drawview-pdf:iosSimulatorArm64Test

      - name: Build the app for the simulator
        # -target: the iosApp scheme is not shared (xcuserdata)
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug
          -sdk iphonesimulator -arch arm64 SYMROOT="$PWD/build/xcode" CODE_SIGNING_ALLOWED=NO build

      - name: Check that PDFium.framework is embedded
        run: test -f build/xcode/Debug-iphonesimulator/*.app/Frameworks/PDFium.framework/PDFium
