# The updates of the dependencies, once a month and grouped, so that a few pull requests come at a
# time. The security updates come on their own as soon as an alert is raised.
#
# Not here: the image of tools/screenshots/Dockerfile, whose fonts and JDK draw the reference
# screenshots (a new image means recording them again, docs/plans/ci-screenshots.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      kotlin-and-compose:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.compose*", "org.jetbrains.kotlinx*", "androidx.compose*"]
      androidx:
        patterns: ["androidx.*", "com.android.*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /native/iroh-bridge
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
