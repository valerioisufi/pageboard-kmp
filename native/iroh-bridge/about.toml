# The licenses accepted in the iroh bridge (cargo-about): permissive ones only
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
]
# The platforms the bridge is built for
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-darwin",
    "aarch64-linux-android",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The crate of the bridge itself is DrawView (its LICENSE)
private = { ignore = true }
